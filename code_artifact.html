<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>整合行銷管理師認證 - 題庫練習系統 (1-55題)</title>
    <style>
        :root {
            /* 圖片指定配色 */
            --color-ice-blue: #DDE6EB;
            --color-lavender: #E4DAF6;
            --color-blush-pink: #EED0E4;
            --color-mist-teal: #B0D7DB;
            --color-mint-aqua: #A4EADF;

            /* 延伸與文字對比色 */
            --text-dark: #2C3A47;
            --text-muted: #596275;
            --white: #FFFFFF;
            --correct-bg: #d4f8f0;
            --correct-border: #20bf6b;
            --correct-text: #0b6e3b;
            --wrong-bg: #fce4ec;
            --wrong-border: #eb3b5a;
            --wrong-text: #9b1c31;
            --shadow: 0 8px 24px rgba(44, 58, 71, 0.08);
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--color-ice-blue) 0%, var(--color-lavender) 50%, var(--color-blush-pink) 100%);
            min-height: 100vh;
            color: var(--text-dark);
            line-height: 1.6;
            padding-bottom: 40px;
        }

        /* 頂部導航與進度列 */
        header {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.05);
            padding: 14px 20px;
        }

        .header-container {
            max-width: 960px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-badge {
            background: linear-gradient(135deg, var(--color-mist-teal), var(--color-mint-aqua));
            color: var(--text-dark);
            font-weight: 800;
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
        }

        .brand h1 {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-dark);
        }

        .stats-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .stat-pill {
            padding: 5px 12px;
            border-radius: 20px;
            background: var(--color-ice-blue);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .stat-pill.correct { background: var(--color-mint-aqua); }
        .stat-pill.wrong { background: var(--color-blush-pink); }

        /* 主容器 */
        .main-container {
            max-width: 960px;
            margin: 24px auto;
            padding: 0 16px;
        }

        /* 模式切換與控制列 */
        .control-panel {
            background: rgba(255, 255, 255, 0.9);
            border-radius: var(--radius);
            padding: 16px 20px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .mode-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .btn {
            border: none;
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-dark);
            background: var(--color-ice-blue);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn:hover {
            transform: translateY(-1px);
            filter: brightness(0.96);
        }

        .btn.active {
            background: var(--color-mist-teal);
            box-shadow: 0 4px 10px rgba(176, 215, 219, 0.5);
        }

        .btn-mint {
            background: var(--color-mint-aqua);
        }

        .btn-pink {
            background: var(--color-blush-pink);
        }

        .btn-lavender {
            background: var(--color-lavender);
        }

        /* 進度條 */
        .progress-wrapper {
            width: 100%;
            height: 8px;
            background: var(--color-ice-blue);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 8px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--color-mist-teal), var(--color-mint-aqua));
            width: 0%;
            transition: width 0.3s ease;
        }

        /* 題目卡片 */
        .question-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: var(--radius);
            padding: 28px;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
            border-top: 6px solid var(--color-mist-teal);
            transition: all 0.3s ease;
        }

        .q-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .q-number {
            background: var(--color-lavender);
            color: var(--text-dark);
            font-weight: 700;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.95rem;
        }

        .q-tag {
            background: var(--color-ice-blue);
            color: var(--text-muted);
            font-size: 0.85rem;
            padding: 4px 10px;
            border-radius: 8px;
            font-weight: 600;
        }

        .bookmark-btn {
            background: transparent;
            border: 1.5px solid var(--color-blush-pink);
            color: var(--text-dark);
            padding: 4px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s;
        }

        .bookmark-btn.bookmarked {
            background: var(--color-blush-pink);
        }

        .q-text {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 22px;
            line-height: 1.65;
        }

        /* 選項列表 */
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-item {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            padding: 15px 18px;
            border-radius: 12px;
            background: var(--color-ice-blue);
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1.05rem;
        }

        .option-item:hover:not(.disabled) {
            background: var(--color-lavender);
            transform: translateX(4px);
        }

        .option-letter {
            min-width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--white);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text-dark);
            flex-shrink: 0;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
        }

        .option-item.selected {
            border-color: var(--color-mist-teal);
            background: #e9f5f6;
        }

        .option-item.correct {
            background: var(--correct-bg);
            border-color: var(--correct-border);
            color: var(--correct-text);
        }

        .option-item.correct .option-letter {
            background: var(--correct-border);
            color: var(--white);
        }

        .option-item.wrong {
            background: var(--wrong-bg);
            border-color: var(--wrong-border);
            color: var(--wrong-text);
        }

        .option-item.wrong .option-letter {
            background: var(--wrong-border);
            color: var(--white);
        }

        .option-item.disabled {
            cursor: default;
        }

        /* 解析區塊 */
        .explanation-box {
            margin-top: 22px;
            padding: 18px 20px;
            border-radius: 12px;
            background: linear-gradient(135deg, rgba(228, 218, 246, 0.45), rgba(164, 234, 223, 0.35));
            border-left: 5px solid var(--color-mist-teal);
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .explanation-box.show {
            display: block;
        }

        .exp-title {
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-dark);
        }

        .exp-answer-badge {
            background: var(--color-mint-aqua);
            padding: 2px 10px;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        .exp-content {
            font-size: 0.98rem;
            color: var(--text-dark);
            line-height: 1.7;
        }

        /* 底部導航按鈕 */
        .nav-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 24px;
            gap: 12px;
        }

        .nav-footer .btn {
            padding: 12px 22px;
            font-size: 1rem;
        }

        /* 題號快速跳轉網格 */
        .drawer-card {
            background: rgba(255, 255, 255, 0.92);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
        }

        .drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .drawer-title {
            font-weight: 700;
            font-size: 1rem;
        }

        .legend {
            display: flex;
            gap: 12px;
            font-size: 0.82rem;
            color: var(--text-muted);
        }

        .legend span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }

        .q-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(42px, 1fr));
            gap: 8px;
        }

        .grid-item {
            height: 40px;
            border-radius: 10px;
            border: 1.5px solid var(--color-ice-blue);
            background: var(--white);
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .grid-item:hover {
            background: var(--color-lavender);
        }

        .grid-item.current {
            border: 2.5px solid var(--text-dark);
            transform: scale(1.06);
        }

        .grid-item.answered-correct {
            background: var(--color-mint-aqua);
            border-color: var(--color-mint-aqua);
        }

        .grid-item.answered-wrong {
            background: var(--color-blush-pink);
            border-color: var(--color-blush-pink);
        }

        .grid-item.is-bookmarked::after {
            content: "★";
            position: absolute;
            top: -4px;
            right: 2px;
            font-size: 0.65rem;
            color: #e67e22;
        }

        /* 瀏覽全部模式下的樣式 */
        .all-list-container .question-card {
            margin-bottom: 24px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 手機版適配 */
        @media (max-width: 640px) {
            .brand h1 {
                font-size: 1.05rem;
            }
            .question-card {
                padding: 20px 16px;
            }
            .q-text {
                font-size: 1.08rem;
            }
            .option-item {
                padding: 12px 14px;
                font-size: 0.98rem;
            }
            .nav-footer .btn {
                padding: 10px 14px;
                font-size: 0.92rem;
            }
            .stats-bar {
                width: 100%;
                justify-content: space-between;
            }
        }
    </style>
</head>
<body>

<header>
    <div class="header-container">
        <div class="brand">
            <span class="brand-badge">MATRIX 認證</span>
            <h1>整合行銷管理師題庫 (第1篇 1-55題)</h1>
        </div>
        <div class="stats-bar">
            <div class="stat-pill">進度: <span id="stat-progress">0/55</span></div>
            <div class="stat-pill correct">答對: <span id="stat-correct">0</span></div>
            <div class="stat-pill wrong">答錯: <span id="stat-wrong">0</span></div>
        </div>
    </div>
</header>

<div class="main-container">
    <!-- 控制列 -->
    <div class="control-panel">
        <div class="mode-tabs">
            <button class="btn active" id="mode-single" onclick="setMode('single')">單題練習模式</button>
            <button class="btn" id="mode-all" onclick="setMode('all')">全卷刷題模式</button>
            <button class="btn" id="mode-wrong" onclick="setMode('wrong')">錯題複習 (<span id="wrong-count-btn">0</span>)</button>
            <button class="btn" id="mode-bookmark" onclick="setMode('bookmark')">重點收藏 (<span id="bookmark-count-btn">0</span>)</button>
        </div>
        <div style="display: flex; gap: 8px;">
            <button class="btn btn-lavender" id="toggle-all-exp-btn" onclick="toggleAllExplanations()" style="display:none;">展開/收合全部解析</button>
            <button class="btn btn-pink" onclick="resetProgress()">重置紀錄</button>
        </div>
        <div class="progress-wrapper">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
    </div>

    <!-- 單題練習區 -->
    <div id="single-view">
        <div id="single-card-container"></div>
    </div>

    <!-- 全卷/篩選列表區 -->
    <div id="list-view" class="all-list-container" style="display: none;"></div>

    <!-- 題號快速跳轉卡 -->
    <div class="drawer-card" id="navigator-drawer">
        <div class="drawer-header">
            <span class="drawer-title">題號快速跳轉導覽 (點擊題號切換)</span>
            <div class="legend">
                <span><i class="dot" style="background: var(--color-mint-aqua);"></i> 答對</span>
                <span><i class="dot" style="background: var(--color-blush-pink);"></i> 答錯</span>
                <span><i class="dot" style="background: #fff; border: 1px solid #ccc;"></i> 未作答</span>
            </div>
        </div>
        <div class="q-grid" id="q-grid"></div>
    </div>
</div>

<script>
// 完整 1-55 題資料庫與詳細解析
const quizData = [
    {
        id: 1,
        topic: "行銷基本定義",
        question: "以下對「行銷」的敘述何者為非？",
        options: [
            "英文為 marketing",
            "中國大陸稱為營銷",
            "行銷等同於銷售",
            "美國行銷協會(American Marketing Association, AMA) 2013年將行銷定義為行銷就是創造、溝通、傳遞與交換對顧客、客戶、合作夥伴與整體社會有價值的活動、架構與流程。"
        ],
        answer: 2, // C
        explanation: "【本題選 (C)】行銷（Marketing）並不等同於銷售（Selling）。銷售僅是行銷職能中的一部分（著重於將既有產品推銷出去）；而現代行銷涵蓋市場調查、產品開發、定價、通路、推廣及顧客關係管理等完整價值創造流程。"
    },
    {
        id: 2,
        topic: "需要、慾求與需求",
        question: "以下對需要(need)與需求(demand)的定義何者為是？",
        options: [
            "先有需求才會有需要",
            "需求是人類與生俱來的生理或心理的特徵",
            "需要是反映消費者的購買力",
            "需求 = 需要 + 購買力"
        ],
        answer: 3, // D
        explanation: "【本題選 (D)】「需要（Need）」是人類與生俱來的基本匱乏感（如飢餓、安全感）；當需要受到文化與個性塑造後形成「慾求（Want）」；當慾求加上「購買力（購買意願與支付能力）」時，才轉化為「需求（Demand）」。因此：需求 = 需要（或慾求）+ 購買力。"
    },
    {
        id: 3,
        topic: "需要、慾求與需求",
        question: "以下對需要(need)、慾求(want)與需求(demand)關係順序何者為是？",
        options: [
            "需要(need) → 慾求(want) → 需求(demand)",
            "需要(need) → 需求(demand) → 慾求(want)",
            "需求(demand) → 慾求(want) → 需要(need)",
            "慾求(want) → 需要(need) → 需求(demand)"
        ],
        answer: 0, // A
        explanation: "【本題選 (A)】消費者行為的演進順序為：先有基本生理或心理的「需要（Need）」→ 經由社會文化與個人偏好形塑出特定物品的「慾求（Want）」→ 再具備足夠金錢與購買意願，成為市場上的有效「需求（Demand）」。"
    },
    {
        id: 4,
        topic: "需要、慾求與需求應用",
        question: "小明已經存了6萬元想要去買一隻 iphone 16手機，小明是屬於下列哪一種消費特徵？",
        options: [
            "需要(need)",
            "需求(demand)",
            "慾求(want)",
            "以上皆非"
        ],
        answer: 1, // B
        explanation: "【本題選 (B)】小明想要購買特定品牌「iPhone 16 手機」（慾求），且「已經存了 6 萬元」代表他同時具備了足夠的購買力，符合「慾求 + 購買力 = 需求（Demand）」的定義。"
    },
    {
        id: 5,
        topic: "需要、慾求與需求應用",
        question: "小華目前正努力打工賺錢準備去購買一隻心儀的 iphone 16手機，小華是屬於下列哪一種消費特徵？",
        options: [
            "需要(need)",
            "需求(demand)",
            "慾求(want)",
            "以上皆非"
        ],
        answer: 2, // C
        explanation: "【本題選 (C)】小華鎖定了特定商品「心儀的 iPhone 16 手機」，但「正努力打工賺錢準備」表示目前尚未具備足夠的購買力，因此仍停留在「慾求（Want）」階段，尚未成為有效需求（Demand）。"
    },
    {
        id: 6,
        topic: "市場評估與需求判斷",
        question: "某鞋商想到非洲土著區開發新市場，發覺土著都沒穿鞋子而且沒有經濟能力買鞋，就悻悻然打道回府放棄非洲市場，請問鞋商為何會選擇放棄市場，是因為發覺非洲土著市場？",
        options: [
            "有需要沒需求",
            "有需求沒需要",
            "有需要沒慾求",
            "有需求沒慾求"
        ],
        answer: 0, // A
        explanation: "【本題選 (A)】土著沒穿鞋子，代表客觀生理上保護雙腳的「需要（Need）」存在；但「沒有經濟能力買鞋」代表缺乏購買力，無法構成「需求（Demand）」，因此該市場屬於「有需要沒需求」。"
    },
    {
        id: 7,
        topic: "市場評估與需求判斷",
        question: "某鞋商想到非洲土著區開發新市場，看到土著都沒穿鞋，很高興潛在市場很大，決定留下經營賣鞋的生意，請問鞋商為何會選擇開發這個市場？",
        options: [
            "發覺市場有需要",
            "發覺市場有慾求",
            "發覺市場有需求",
            "以上皆非"
        ],
        answer: 0, // A
        explanation: "【本題選 (A)】經典行銷故事中，另一位鞋商看到大家沒穿鞋，認為人人都缺乏保護腳部的基本功能，代表發覺了龐大的潛在「需要（Need）」，可透過教育市場與設計平價產品將需要轉化為需求。"
    },
    {
        id: 8,
        topic: "市場評估與需求判斷",
        question: "下列敘述何者正確？",
        options: [
            "一般商人最希望看到有需要的市場",
            "一般商人最希望看到有需求的市場",
            "一般商人最希望看到有慾求的市場",
            "以上皆是"
        ],
        answer: 1, // B
        explanation: "【本題選 (B)】企業要能獲利與生存，消費者必須既有購買意願又有實際支付能力，也就是「需求（Demand）」。有需要或慾求若無購買力，企業仍無法實現銷售營收。"
    },
    {
        id: 9,
        topic: "交換概念",
        question: "以下對交換(exchange)的說明何者為非？",
        options: [
            "所有的產品與服務的買賣都屬交換行為",
            "擔任 NPO 志工也是屬於交換行為",
            "交換一定要有對應的價格",
            "交換的代價可以是金錢、勞務、時間"

// 狀態管理
let state = {
    mode: 'single', // 'single', 'all', 'wrong', 'bookmark'
    currentIndex: 0,
    userAnswers: {}, // { questionId: selectedOptionIndex }
    bookmarks: [],   // [questionId, ...]
    showAllExp: false
};

const STORAGE_KEY = 'integrated_marketing_quiz_v1';
const letters = ['A', 'B', 'C', 'D'];

// 初始化載入本地紀錄
function loadState() {
    try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
            const parsed = JSON.parse(saved);
            state.userAnswers = parsed.userAnswers || {};
            state.bookmarks = parsed.bookmarks || [];
            state.currentIndex = parsed.currentIndex || 0;
        }
    } catch (e) {
        console.error("讀取紀錄失敗", e);
    }
}

function saveState() {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
            userAnswers: state.userAnswers,
            bookmarks: state.bookmarks,
            currentIndex: state.currentIndex
        }));
    } catch (e) {
        console.error("儲存紀錄失敗", e);
    }
}

// 更新頂部數據統計與進度條
function updateStats() {
    const total = quizData.length;
    const answeredIds = Object.keys(state.userAnswers).map(Number);
    let correctCount = 0;
    let wrongCount = 0;

    answeredIds.forEach(id => {
        const q = quizData.find(item => item.id === id);
        if (q) {
            if (state.userAnswers[id] === q.answer) {
                correctCount++;
            } else {
                wrongCount++;
            }
        }
    });

    document.getElementById('stat-progress').textContent = `${answeredIds.length}/${total}`;
    document.getElementById('stat-correct').textContent = correctCount;
    document.getElementById('stat-wrong').textContent = wrongCount;
    document.getElementById('wrong-count-btn').textContent = wrongCount;
    document.getElementById('bookmark-count-btn').textContent = state.bookmarks.length;

    const pct = Math.round((answeredIds.length / total) * 100);
    document.getElementById('progress-fill').style.width = `${pct}%`;

    renderNavigatorGrid();
}

// 切換模式
function setMode(newMode) {
    state.mode = newMode;
    document.querySelectorAll('.mode-tabs .btn').forEach(btn => btn.classList.remove('active'));
    document.getElementById(`mode-${newMode}`).classList.add('active');

    const singleView = document.getElementById('single-view');
    const listView = document.getElementById('list-view');
    const toggleExpBtn = document.getElementById('toggle-all-exp-btn');
    const drawer = document.getElementById('navigator-drawer');

    if (newMode === 'single') {
        singleView.style.display = 'block';
        listView.style.display = 'none';
        toggleExpBtn.style.display = 'none';
        drawer.style.display = 'block';
        renderSingleQuestion();
    } else {
        singleView.style.display = 'none';
        listView.style.display = 'block';
        toggleExpBtn.style.display = 'inline-flex';
        drawer.style.display = 'none';
        renderListQuestions();
    }
}

// 產生單張題目卡片 HTML
function createQuestionCardHTML(q, isSingleMode) {
    const userAns = state.userAnswers[q.id];
    const isAnswered = userAns !== undefined;
    const isBookmarked = state.bookmarks.includes(q.id);

    const optionsHTML = q.options.map((optText, idx) => {
        let extraClass = '';
        if (isAnswered) {
            extraClass += ' disabled';
            if (idx === q.answer) {
                extraClass += ' correct';
            } else if (idx === userAns && userAns !== q.answer) {
                extraClass += ' wrong';
            }
        }
        return `
            <div class="option-item ${extraClass}" onclick="handleSelectOption(${q.id}, ${idx})">
                <div class="option-letter">${letters[idx]}</div>
                <div class="option-text">${optText}</div>
            </div>
        `;
    }).join('');

    const showExp = isAnswered || (!isSingleMode && state.showAllExp);
    const statusIcon = isAnswered
        ? (userAns === q.answer ? '✅ 答對了！' : '❌ 答錯了！')
        : '💡 題目解析';

    return `
        <div class="question-card" id="q-card-${q.id}">
            <div class="q-header">
                <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
                    <span class="q-number">第 ${q.id} 題 / 共 55 題</span>
                    <span class="q-tag"># ${q.topic}</span>
                </div>
                <button class="bookmark-btn ${isBookmarked ? 'bookmarked' : ''}" onclick="toggleBookmark(${q.id})">
                    ${isBookmarked ? '★ 已收藏' : '☆ 收藏此題'}
                </button>
            </div>
            <div class="q-text">${q.question}</div>
            <div class="options-list">
                ${optionsHTML}
            </div>
            <div class="explanation-box ${showExp ? 'show' : ''}" id="exp-${q.id}">
                <div class="exp-title">
                    <span>${statusIcon}</span>
                    <span class="exp-answer-badge">正確答案：(${letters[q.answer]})</span>
                </div>
                <div class="exp-content">${q.explanation}</div>
            </div>
            ${isSingleMode ? `
            <div class="nav-footer">
                <button class="btn" onclick="prevQuestion()" ${state.currentIndex === 0 ? 'disabled style="opacity:0.5;cursor:not-allowed;"' : ''}>← 上一題</button>
                <button class="btn btn-lavender" onclick="toggleSingleExp(${q.id})">查看/隱藏解析</button>
                <button class="btn btn-mint" onclick="nextQuestion()" ${state.currentIndex === quizData.length - 1 ? 'disabled style="opacity:0.5;cursor:not-allowed;"' : ''}>下一題 →</button>
            </div>
            ` : ''}
        </div>
    `;
}

// 渲染單題模式
function renderSingleQuestion() {
    const container = document.getElementById('single-card-container');
    const q = quizData[state.currentIndex];
    container.innerHTML = createQuestionCardHTML(q, true);
    renderNavigatorGrid();
}

// 渲染列表模式（全卷 / 錯題 / 收藏）
function renderListQuestions() {
    const container = document.getElementById('list-view');
    let filtered = quizData;

    if (state.mode === 'wrong') {
        filtered = quizData.filter(q => state.userAnswers[q.id] !== undefined && state.userAnswers[q.id] !== q.answer);
    } else if (state.mode === 'bookmark') {
        filtered = quizData.filter(q => state.bookmarks.includes(q.id));
    }

    if (filtered.length === 0) {
        const emptyMsg = state.mode === 'wrong'
            ? '太棒了！目前沒有答錯的題目 🎉'
            : '目前還沒有收藏任何題目，點擊題目右上角的「☆ 收藏此題」即可加入複習清單！';
        container.innerHTML = `
            <div class="question-card" style="text-align:center; padding: 40px 20px;">
                <p style="font-size:1.1rem; font-weight:600; color:var(--text-muted);">${emptyMsg}</p>
                <button class="btn btn-mint" style="margin-top:16px;" onclick="setMode('single')">回到單題練習</button>
            </div>
        `;
        return;
    }

    container.innerHTML = filtered.map(q => createQuestionCardHTML(q, false)).join('');
}

// 處理作答點擊
function handleSelectOption(questionId, optionIndex) {
    // 若已作答則不重複覆蓋（避免誤觸，若想重做可按重置或重新點選）
    if (state.userAnswers[questionId] !== undefined) return;

    state.userAnswers[questionId] = optionIndex;
    saveState();
    updateStats();

    if (state.mode === 'single') {
        renderSingleQuestion();
    } else {
        // 局部更新該題卡片以保持捲動位置
        const q = quizData.find(item => item.id === questionId);
        const cardEl = document.getElementById(`q-card-${questionId}`);
        if (cardEl && q) {
            cardEl.outerHTML = createQuestionCardHTML(q, false);
        }
    }
}

// 單題模式下手動開關解析
function toggleSingleExp(questionId) {
    const expEl = document.getElementById(`exp-${questionId}`);
    if (expEl) {
        expEl.classList.toggle('show');
    }
}

// 全卷模式下展開/收合全部解析
function toggleAllExplanations() {
    state.showAllExp = !state.showAllExp;
    renderListQuestions();
}

// 收藏切換
function toggleBookmark(questionId) {
    const idx = state.bookmarks.indexOf(questionId);
    if (idx > -1) {
        state.bookmarks.splice(idx, 1);
    } else {
        state.bookmarks.push(questionId);
    }
    saveState();
    updateStats();

    if (state.mode === 'single') {
        renderSingleQuestion();
    } else {
        renderListQuestions();
    }
}

// 上一題 / 下一題 / 跳題
function prevQuestion() {
    if (state.currentIndex > 0) {
        state.currentIndex--;
        saveState();
        renderSingleQuestion();
    }
}

function nextQuestion() {
    if (state.currentIndex < quizData.length - 1) {
        state.currentIndex++;
        saveState();
        renderSingleQuestion();
    }
}

function jumpToQuestion(index) {
    state.currentIndex = index;
    saveState();
    if (state.mode !== 'single') {
        setMode('single');
    } else {
        renderSingleQuestion();
    }
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

// 渲染底部 1-55 題快速導覽網格
function renderNavigatorGrid() {
    const grid = document.getElementById('q-grid');
    grid.innerHTML = quizData.map((q, idx) => {
        const userAns = state.userAnswers[q.id];
        let statusClass = '';
        if (userAns !== undefined) {
            statusClass = userAns === q.answer ? 'answered-correct' : 'answered-wrong';
        }
        const currentClass = (state.mode === 'single' && idx === state.currentIndex) ? 'current' : '';
        const bookmarkClass = state.bookmarks.includes(q.id) ? 'is-bookmarked' : '';

        return `
            <button class="grid-item ${statusClass} ${currentClass} ${bookmarkClass}" onclick="jumpToQuestion(${idx})">
                ${q.id}
            </button>
        `;
    }).join('');
}

// 重置紀錄
function resetProgress() {
    if (confirm('確定要清除所有作答紀錄與分數統計嗎？（收藏題目將會保留）')) {
        state.userAnswers = {};
        state.currentIndex = 0;
        saveState();
        updateStats();
        if (state.mode === 'single') {
            renderSingleQuestion();
        } else {
            renderListQuestions();
        }
    }
}

// 鍵盤左右鍵支援（電腦版方便刷題）
document.addEventListener('keydown', (e) => {
    if (state.mode === 'single') {
        if (e.key === 'ArrowLeft') prevQuestion();
        if (e.key === 'ArrowRight') nextQuestion();
    }
});

// 啟動初始化
loadState();
updateStats();
renderSingleQuestion();
</script>

</body>
</html>
